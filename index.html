  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-2deg); }
    50% { transform: translateX(8px) rotate(2deg); }

  }
  .anim-damage { animation: shake 0.35s ease-in-out; }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }

  }
  .damage-popup {
    animation: floatUp 0.9s forwards ease-out;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(239,68,68,0.9);
  }
  .heal-popup {
    animation: floatUp 0.9s forwards ease-out;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(34,197,94,0.9);
  }
  .coin-spin { animation: spinY 0.5s ease-out; }

    0% { transform: rotateY(0deg) scale(0.6); }
    100% { transform: rotateY(720deg) scale(1); }
